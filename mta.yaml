_schema-version: "3.3"
ID: timesheet
description: Timesheet CAP project.
version: 1.0.0
modules:
  - name: timesheet-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: timesheet-auth
      - name: timesheet-db
      - name: timesheet-destination-service
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: timesheet-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: timesheet-db
    parameters:
      buildpack: nodejs_buildpack
  - name: timesheet
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: timesheet-auth
      - name: timesheet-destination-service
        group: destinations
        properties:
          forwardAuthToken: false
          name: ui5
          url: https://ui5.sap.com
      - name: timesheet-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: comorigintimesheetui
    type: html5
    path: app/timesheet-ui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: timesheet-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: timesheet-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comorigintimesheetui.zip
          name: comorigintimesheetui
          target-path: resources/

 
  - name: timesheet-destinations
    type: com.sap.application.content
    requires:
      - name: timesheet-auth
        parameters:
          service-key:
            name: timesheet-auth-key
      - name: timesheet-html5-repo-host
        parameters:
          service-key:
            name: timesheet-html5-repo-host-key
      - name: srv-api
      - name: timesheet-destination-service
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: timesheet-html5-repository
              ServiceInstanceName: timesheet-html5-repo-host
              ServiceKeyName: timesheet-html5-repo-host-key
              sap.cloud.service: timesheet.service
            - Name: timesheet-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: timesheet-auth
              ServiceKeyName: timesheet-auth-key
              sap.cloud.service: timesheet.service
resources:
  - name: timesheet-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: timesheet-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: timesheet-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: timesheet-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api
  - name: timesheet-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: timesheet-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: timesheet-destination-service
      service-plan: lite
    requires:
      - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
